name: youtube-backend-integration

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-youtube-backend-integration}-runtime:local
  build:
    context: ..
    dockerfile: 02_api_backend/Dockerfile.integration
    target: runtime
  init: true
  environment: &settings
    MINIPROJECT_ROOT: /app
    APP_ENV: ${APP_ENV:-development}
    AUTH_ENABLED: ${AUTH_ENABLED:-true}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    ADAPTER_MODE: custom
    ADAPTER_FACTORY: youtube_backend.team:create_adapters
    BACKEND_INTEGRATION_PROFILE: ${BACKEND_INTEGRATION_PROFILE:-offline}
    DATABASE_URL: sqlite:////app/runtime/app.db
    CHROMA_PERSIST_DIR: /app/runtime/chroma
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash}
    EMBEDDING_PROVIDER: gemini
    EMBEDDING_MODEL: gemini-embedding-2
    EMBEDDING_DIMENSIONS: "1536"
    API_HOST: 0.0.0.0
    API_PORT: "8000"
    ENABLE_STREAMING: "false"
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    JOB_LEASE_SECONDS: "30"
    AGENT_TIMEOUT_SECONDS: "120"
    AGENT_MAX_STEPS: "8"
    AGENT_FINALIZE_RESERVE_SECONDS: "10"
  volumes:
    - integration-data:/app/runtime

services:
  migrate:
    <<: *backend
    command: ["yk-backend-init"]
    restart: "no"
  api:
    <<: *backend
    command: ["yk-api"]
    ports:
      - "127.0.0.1:${BACKEND_INTEGRATION_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
  worker:
    <<: *backend
    command: ["yk-worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  seed:
    <<: *backend
    profiles: ["demo"]
    command: ["yk-backend-demo-seed", "--video-id", "dQw4w9WgXcQ", "--video-id", "jNQXAC9IVRw"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  tests:
    image: ${COMPOSE_PROJECT_NAME:-youtube-backend-integration}-tests:local
    build:
      context: ..
      dockerfile: 02_api_backend/Dockerfile.integration
      target: test
    profiles: ["test"]
    init: true
    network_mode: none
    environment:
      MINIPROJECT_ROOT: /app
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""

volumes:
  integration-data:
