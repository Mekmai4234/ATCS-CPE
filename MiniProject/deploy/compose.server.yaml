# Server overlay for 07_testing_deployment/compose.transcript.yaml.
# Public HTTPS on ${PUBLIC_HOST}: Caddy gets a Let's Encrypt certificate automatically.
# Use deploy/deploy.sh rather than calling compose directly.
# Relative paths resolve from 07_testing_deployment/ (the first compose file's directory).

x-server-env: &server-env
  APP_ENV: production
  AUTH_ENABLED: "true"
  SESSION_COOKIE_SECURE: "true"
  WEB_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.local}
  AUTH_TRUSTED_ORIGINS: '["https://${PUBLIC_HOST}"]'

services:
  migrate:
    environment: *server-env
  api:
    environment: *server-env
  worker:
    environment: *server-env

  web:
    build:
      args:
        PUBLIC_ORIGIN: https://${PUBLIC_HOST}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env.local}
    image: video-buddy-web:server
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - ../deploy/Caddyfile.server:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/ready"]

volumes:
  # Holds the TLS certificates; keep it so certificates are not re-issued on every deploy.
  caddy-data:
  caddy-config:
