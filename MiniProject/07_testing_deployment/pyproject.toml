[project]
name = "youtube-knowledge-verification"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "youtube-knowledge-answers[team]",
  "httpx2>=2.13.1",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
youtube-knowledge-answers = { path = "../05_ai_answers_analysis", editable = true }
youtube-knowledge-backend = { path = "../02_api_backend", editable = true }
youtube-knowledge-ingestion = { path = "../03_video_ingestion", editable = true }
youtube-knowledge-rag = { path = "../04_rag_knowledge", editable = true }
youtube-knowledge-agent = { path = "../06_research_learning_agent", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "regression: release-blocking checks of existing module 03/04 defects",
  "auth: strict multi-account acceptance requiring the real backend auth contract",
  "free_tier_contract: strict media/broker feature gate; run explicitly, absent features fail",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
