# Standalone private model service. Operator pins the image digest before starting.
name: video-buddy-local
services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set a reviewed Ollama image@sha256 digest}
    profiles: [local]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - local-models:/root/.ollama
    networks: [inference]
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
    init: true
    restart: "no"
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  inference:
    internal: true
volumes:
  local-models:
