# Isolated production-config startup test, NOT a release override or attestation.
x-auth-drill: &auth
  APP_ENV: production
  AUTH_ENABLED: "true"
  SESSION_COOKIE_SECURE: "true"
  GOOGLE_CLIENT_ID: fixture07.apps.googleusercontent.com
  WEB_ORIGIN: https://localhost
  AUTH_TRUSTED_ORIGINS: '["https://localhost"]'
  GEMINI_API_KEY: fixture07-no-provider-requests
services:
  initialize:
    environment: *auth
  api:
    environment: *auth
    ports: !reset []
  worker:
    environment: *auth
  web:
    image: youtube-knowledge-team07-web:auth-check
    environment:
      PUBLIC_HOST: localhost
    depends_on:
      api:
        condition: service_healthy
networks:
  default:
    internal: true
