# Prospective release overlay. Must remain blocked until integrated evidence exists.
x-auth: &auth
  APP_ENV: production
  AUTH_ENABLED: "true"
  SESSION_COOKIE_SECURE: "true"
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set the public Google client ID}
  WEB_ORIGIN: https://${PUBLIC_HOST:?Set the registered hostname without scheme/path}
  AUTH_TRUSTED_ORIGINS: '["https://${PUBLIC_HOST}"]'

services:
  initialize:
    environment: *auth
    command: ["python", "07_testing_deployment/scripts/preflight.py", "--auth-evidence", "/evidence/release.json", "--require-key", "--initialize"]
    volumes:
      - ${AUTH_EVIDENCE_DIR:?Set reviewed evidence directory}:/evidence:ro
  api:
    environment: *auth
    command: ["python", "07_testing_deployment/scripts/preflight.py", "--auth-evidence", "/evidence/release.json", "--run", "api"]
    ports: !reset []
    volumes:
      - ${AUTH_EVIDENCE_DIR}:/evidence:ro
  worker:
    environment: *auth
    command: ["python", "07_testing_deployment/scripts/preflight.py", "--auth-evidence", "/evidence/release.json", "--run", "worker"]
    volumes:
      - ${AUTH_EVIDENCE_DIR}:/evidence:ro
  web:
    build:
      context: ..
      dockerfile: 07_testing_deployment/Dockerfile.web
      args:
        PUBLIC_ORIGIN: https://${PUBLIC_HOST}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  proxy-data:
  proxy-config:
