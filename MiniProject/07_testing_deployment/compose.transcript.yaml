name: video-buddy

x-runtime: &runtime
  build:
    context: ..
    dockerfile: 07_testing_deployment/Dockerfile
    target: runtime
  image: video-buddy-runtime:local
  init: true
  env_file:
    - path: ${VIDEO_BUDDY_ENV_FILE:-../.env.local}
      required: false
  environment: &configuration
    MINIPROJECT_ROOT: /app
    APP_ENV: development
    AUTH_ENABLED: "true"
    SESSION_COOKIE_SECURE: "false"
    WEB_ORIGIN: http://localhost:3000
    AUTH_TRUSTED_ORIGINS: '["http://localhost:3000"]'
    ADAPTER_MODE: custom
    ADAPTER_FACTORY: youtube_answers.team:create_adapters
    BACKEND_INTEGRATION_PROFILE: live
    BACKEND_FULL_PREFLIGHT: "true"
    DATABASE_URL: sqlite:////app/runtime/app.db
    CHROMA_PERSIST_DIR: /app/runtime/chroma
    MEDIA_ASSET_DIR: /app/runtime/media-assets
    API_HOST: 0.0.0.0
    API_PORT: "8000"
    EMBEDDING_PROVIDER: gemini
    EMBEDDING_MODEL: gemini-embedding-2
    EMBEDDING_DIMENSIONS: "1536"
    EMBEDDING_TOKENIZER: utf8-byte-budget-v1
    CHUNK_TARGET_TOKENS: "600"
    CHUNK_OVERLAP_TOKENS: "100"
    WORKER_POLL_SECONDS: "0.05"
    JOB_LEASE_SECONDS: "30"
    ENABLE_STREAMING: "false"
  volumes:
    - state:/app/runtime
  cpus: 2
  mem_limit: 3g
  pids_limit: 256
  stop_grace_period: 45s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-test: &test
  profiles: [test]
  build:
    context: ..
    dockerfile: 07_testing_deployment/Dockerfile
    target: test
  image: video-buddy-tests:local
  init: true
  network_mode: none
  environment:
    MINIPROJECT_ROOT: /app
    APP_ENV: test
    GEMINI_API_KEY: ""
    OPENAI_API_KEY: ""
    RUN_LIVE_EMBEDDING_TESTS: "0"
    PYTHONUTF8: "1"
    RUFF_CACHE_DIR: /tmp/ruff-cache
  volumes:
    - ${VIDEO_BUDDY_REPORT_DIR:-./runtime/transcript-v3-docker}:/evidence
    - ${VIDEO_BUDDY_REPORT_DIR:-./runtime/transcript-v3-docker}:/app/07_testing_deployment/runtime
  cpus: 2
  mem_limit: 3g
  pids_limit: 256
  restart: "no"

services:
  migrate:
    <<: *runtime
    command: [python, 07_testing_deployment/scripts/transcript_runtime.py, migrate]
    restart: "no"
    labels: { video-buddy.module: "02/07", video-buddy.role: "one-shot-migration" }
  api:
    <<: *runtime
    command: [python, 07_testing_deployment/scripts/transcript_runtime.py, api]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    labels: { video-buddy.module: "02", video-buddy.role: "authenticated-api" }
  worker:
    <<: *runtime
    command: [python, 07_testing_deployment/scripts/transcript_runtime.py, worker]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, python, -c, "from youtube_backend.config import Settings; from youtube_backend.workspace import worker_status; assert worker_status(Settings())['ready']"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    labels: { video-buddy.module: "02/03/04/05/06", video-buddy.role: "durable-worker" }
  transcript-import:
    <<: *runtime
    profiles: [import]
    command: [python, -m, youtube_ingestion.document_cli, import, --root, /app/Transcript]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: "no"
    labels: { video-buddy.module: "03/04/02", video-buddy.role: "explicit-local-import" }
  web:
    build:
      context: ..
      dockerfile: 07_testing_deployment/Dockerfile.web
      target: local
      args:
        PUBLIC_ORIGIN: http://localhost:3000
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: video-buddy-web:local
    ports: ["127.0.0.1:${VIDEO_BUDDY_WEB_PORT:-3000}:80"]
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/ready]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    cpus: 1
    mem_limit: 256m
    labels: { video-buddy.module: "01", video-buddy.role: "same-origin-web-proxy" }
  test-01-web:
    <<: *test
    build: { context: .., dockerfile: 07_testing_deployment/Dockerfile, target: test-web }
    image: video-buddy-web-tests:local
    network_mode: bridge
    working_dir: /app/01_web_app
    command: [sh, -c, "pnpm typecheck && pnpm format:check && pnpm test && pnpm build && pnpm exec playwright test --config ../07_testing_deployment/playwright.config.ts"]
  test-02-api:
    <<: *test
    command: [sh, -c, "python -m pytest 02_api_backend/tests -q -o cache_dir=/tmp/cache02 --junitxml=/evidence/02-api.xml && python -m pytest 02_api_backend/integration/tests -q -o cache_dir=/tmp/cache02i --junitxml=/evidence/02-integration.xml && python -m pytest 02_api_backend/full/tests -q -o cache_dir=/tmp/cache02f --junitxml=/evidence/02-full.xml"]
  test-03-ingestion:
    <<: *test
    command: [python, -m, pytest, 03_video_ingestion/tests, -q, -m, "not live", -o, cache_dir=/tmp/cache03, --junitxml=/evidence/03-ingestion.xml]
  test-04-rag:
    <<: *test
    command: [python, -m, pytest, 04_rag_knowledge/tests, -q, -m, "not live", -o, cache_dir=/tmp/cache04, --junitxml=/evidence/04-rag.xml]
  test-05-answers:
    <<: *test
    command: [python, -m, pytest, 05_ai_answers_analysis/tests, -q, -o, cache_dir=/tmp/cache05, --junitxml=/evidence/05-answers.xml]
  test-06-learning:
    <<: *test
    command: [python, -m, pytest, 06_research_learning_agent/tests, -q, -o, cache_dir=/tmp/cache06, --junitxml=/evidence/06-learning.xml]
  test-07-e2e:
    <<: *test
    build: { context: .., dockerfile: 07_testing_deployment/Dockerfile, target: test-web }
    image: video-buddy-web-tests:local
    network_mode: bridge
    working_dir: /app
    command: [sh, -c, "python -m pytest 07_testing_deployment/tests -q -o cache_dir=/tmp/cache07 --junitxml=/evidence/07-e2e.xml && python 07_testing_deployment/scripts/browser_identity.py --image"]

volumes:
  state:
