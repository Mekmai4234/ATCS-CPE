# Local transcript-first stack (project video-buddy). Not a public deployment:
# HTTP on 127.0.0.1:3000 only; production HTTPS/review stays in compose.auth.yaml.
#
#   docker compose -f 07_testing_deployment/compose.transcript.yaml build
#   docker compose -f 07_testing_deployment/compose.transcript.yaml up -d
#
# Secrets (GEMINI_API_KEY, GOOGLE_CLIENT_ID) come from ../.env.local and are never
# written here. The Free Tier policy directory is mounted read-only; renew the
# policy in place, then restart api and worker.
name: video-buddy

x-runtime: &runtime
  build:
    context: ..
    dockerfile: 07_testing_deployment/Dockerfile.transcript
  image: video-buddy-runtime:local
  init: true
  user: "10001:10001"
  mem_limit: 3g
  cpus: 2
  pids_limit: 256
  env_file: ../.env.local
  environment:
    MINIPROJECT_ROOT: /app
    API_HOST: 0.0.0.0
    API_PORT: "8000"
    DATABASE_URL: sqlite:////app/runtime/app.db
    CHROMA_PERSIST_DIR: /app/runtime/chroma
    MEDIA_ASSET_DIR: /app/runtime/media-assets
    GEMINI_FREE_POLICY_FILE: /app/policy/gemini-free-policy.json
    EMBEDDING_DIMENSIONS: "1536"
    EMBEDDING_TOKENIZER: utf8-byte-budget-v1
    CHUNK_TARGET_TOKENS: "600"
    CHUNK_OVERLAP_TOKENS: "100"
    JOB_LEASE_SECONDS: "30"
    WORKER_POLL_SECONDS: "0.05"
  volumes:
    - state:/app/runtime
    - ../runtime/free-tier-20261026:/app/policy:ro

services:
  migrate:
    <<: *runtime
    command: ["python", "07_testing_deployment/scripts/transcript_runtime.py", "migrate"]
    restart: "no"

  api:
    <<: *runtime
    command: ["python", "07_testing_deployment/scripts/transcript_runtime.py", "api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *runtime
    command: ["python", "07_testing_deployment/scripts/transcript_runtime.py", "worker"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from youtube_backend.config import Settings; from youtube_backend.workspace import worker_status; assert worker_status(Settings())['ready']"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: 07_testing_deployment/Dockerfile.web
      args:
        PUBLIC_ORIGIN: http://localhost:3000
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: video-buddy-web:local
    mem_limit: 256m
    cpus: 1
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      # Plain HTTP :80 with /ready proxied; the default Caddyfile is the HTTPS profile.
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  # Existing local data volume (video-buddy_state); never recreated by this file.
  state:
