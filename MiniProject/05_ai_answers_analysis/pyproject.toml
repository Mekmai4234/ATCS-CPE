[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "youtube-knowledge-answers"
version = "0.1.0"
description = "Grounded answers, summaries and comparisons (module 05)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "youtube-knowledge-backend",
  "youtube-knowledge-rag",
  "google-genai>=1.60,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[project.optional-dependencies]
team = ["youtube-knowledge-agent", "youtube-knowledge-ingestion"]

[tool.uv.sources]
youtube-knowledge-backend = { path = "../02_api_backend", editable = true }
youtube-knowledge-rag = { path = "../04_rag_knowledge", editable = true }
youtube-knowledge-agent = { path = "../06_research_learning_agent", editable = true }
youtube-knowledge-ingestion = { path = "../03_video_ingestion", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_answers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
